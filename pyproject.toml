########################
### Project Metadata ###
########################

[project]
name = "garnet"
description = "The Single Crystal Graphical Advanced Reduction Neutron Event Toolkit Project"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "GPL version 3.0" }
readme = "README.md"
keywords = [
    "neutrons",
    "garnet",
    "single crystal diffraction",
    "data reduction",
]

[project.urls]
homepage = "https://github.com/neutrons/garnet/"
repository = "https://github.com/neutrons/garnet/"
issues = "https://github.com/neutrons/garnet/issues"

[project.gui-scripts]
garnet = "garnet.garnet:gui"

####################
### Build config ###
####################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build]
artifacts = ["*.yml", "*.yaml", "*.ini"]

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/garnet/_version.py"
build-file = "src/garnet/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/garnet"]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.0.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}"
distance-dirty = "{next_version}.dev{distance}"

[tool.versioningit.write]
file = "src/garnet/_version.py"

###################
### Pixi config ###
###################

[tool.pixi.workspace]
name = "garnet"
platforms = ["linux-64"]
channels = [
    "conda-forge",
    "mantid",
    "oncat",
    "https://prefix.dev/pixi-build-backends",
]
# Required until the build feature becomes stable
preview = ["pixi-build"]

[tool.pixi.package]
name = "garnet"
version = "0.0.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.1.*" }

[tool.pixi.dependencies]
mantidworkbench = ">=6.12.0.2"
pyoncat = ">=2.1"
pyqt = ">=5,<6"
qtpy = ">=2.4.3"

[tool.pixi.pypi-dependencies]
garnet = { path = ".", editable = true }

[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"

# Environments and features

[tool.pixi.environments]
default = { features = [
    "dev",
    "docs",
    "test",
    "build",
], solve-group = "default" }
docs = { features = ["dev", "docs"], no-default-feature = true }
build = { features = ["build"], no-default-feature = true }

[tool.pixi.feature.build.dependencies]
anaconda-client = ">=1.13.0"
check-wheel-contents = ">=0.6.2"
versioningit = ">=3.2.0"

[tool.pixi.feature.build.pypi-dependencies]
toml-cli = "*"

[tool.pixi.feature.dev.dependencies]
pip = ">=25.1.1"
pip-audit = ">=2.9.0"
pre-commit = ">=4.2.0"
ruff = "*"
versioningit = ">=3.2.0"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8"
sphinx_rtd_theme = ">=3.0.1"
sphinxcontrib-mermaid = ">=1.0.0"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx-qt-documentation = "*"

[tool.pixi.feature.test.dependencies]
codecov = ">=2.1.13"
pytest = ">=8.4.1"
pytest-cov = ">=6.2.1"
pytest-qt = ">=4.4.0"
pytest-xvfb = ">=3.1.1"

[tool.pixi.tasks]
# Documentation
build-docs = { cmd = 'sphinx-build -b html docs/source docs/_build/html', description = "Build documentation" }
test-docs = { cmd = "sphinx-build -M doctest docs/source docs/_build/html", description = "Test building the documentation" }
# Testing
test = { description = "Run the test suite", cmd = "pytest" }
# Packaging
conda-build-command = { cmd = "pixi build", description = "Wrapper for building the conda package - used by `conda-build`" }
conda-build = { description = "Build the conda package", depends-on = [
    "sync-version",
    "conda-build-command",
    "reset-version",
] }
conda-publish = { cmd = "anaconda upload *.conda", description = "Publish the .conda package to anaconda.org", depends-on = [
    "conda-build",
] }
# Misc
audit-deps = { cmd = "pip-audit --local -s osv", description = "Audit the package dependencies for vulnerabilities" }
clean = { cmd = 'rm -rf .mypy_cache .pytest_cache .ruff_cache **/*.egg-info **/dist **/__pycache__ **/_version.py', description = "Clean up various caches and build artifacts" }
clean-conda = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean up documentation build artifacts" }
clean-all = { description = "Clean all artifacts", depends-on = [
    "clean",
    "clean-conda",
    "clean-docs",
] }
sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
reset-version = { cmd = "toml set tool.pixi.package.version \"0.0.0\" --toml-path pyproject.toml", description = "Reset the package version to 0.0.0" }


##########################
### Pytest and CodeCov ###
##########################

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [
    ".git",
    "tmp*",
    "_tmp*",
    "__pycache__",
    "*dataset*",
    "*data_set*",
]
markers = ["datarepo: Tests that require the test-data submodule"]

[tool.coverage.report]
exclude_lines = ["except ImportError:", "except ModuleNotFoundError:"]

############
### Ruff ###
############

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# https://beta.ruff.rs/docs/rules/
# suggestions: BLE blind exceptions, I sorts imports
# Full pylint PL = PLC, PLE, PLR (~500 issues), PLW. Enable most
select = [
    "A",
    "ARG",
    "E",
    "F",
    "W",
    "PL",
    "C90",
    "I",
    "N",
    "D",
    "UP032",
    "ANN",
    "ASYNC",
    "S303",
    "S307",
    "S308",
    "BLE",
    "B015",
    "B021",
    "PIE",
    "T20",
    "SIM",
    "PT",
]
ignore = [
    "D100",   # Missing docstring in public module
    "D203",   # conflict with D211
    "D213",   # conflict with D212
    "D400",
    "D415",
    "ANN201", # Unnecessary
]
exclude = [
    "src/garnet/helpers/__init__.py",
    "src/garnet/helpers/ui_elements/__init__.py",
]
